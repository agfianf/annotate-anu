[project]
name = "sam3-yolo-app"
version = "0.1.0"
description = "SAM3 Segment Anything Model 3 API with FastAPI and Ultralytics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # FastAPI core
    "fastapi>=0.115.4",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.12.0",
    "python-multipart>=0.0.20",
    "uvicorn>=0.32.0",

    # Ultralytics / SAM3
    "ultralytics>=8.3.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",

    # Image processing
    "pillow>=10.0.0",
    "matplotlib>=3.8.0",
    "opencv-python-headless>=4.8.0"
]

[dependency-groups]
dev = [
    "ruff>=0.9.4",
    "ipython>=8.31.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
