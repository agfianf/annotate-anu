[project]
name = "anu-model-server"
version = "0.1.0"
description = "Generic BYOM-compatible server for local Ultralytics/YOLO .pt weights"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pillow>=10.4.0",
    "numpy>=1.26.0",
    "ultralytics>=8.3.0",
    "torch>=2.5.0",
    "torchvision>=0.20.0",
]

# cu128 wheels match the host driver (CUDA 12.8) and carry their own runtime
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
